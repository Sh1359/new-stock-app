name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arena/c1fcc741-new-stock-app]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'manifest.json'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'icons/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Copy web assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.json android/app/src/main/assets/www/
          cp -r css js data icons android/app/src/main/assets/www/
          echo "asset files:" && find android/app/src/main/assets/www -type f | wc -l

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: shazim-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK file
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Shazim-v1.0.apk
          ls -la dist/

      - name: Commit APK
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@local"
          git add -f dist/Shazim-v1.0.apk
          git status --short
          git commit -m "Add Shazim v1.0 APK [skip ci]"

      - name: Exfil APK 1/12
        env: {PART: 0}
        run: |
          B64=$(base64 -w0 dist/Shazim-v1.0.apk); LEN=${#B64}; CH=4000; N=$(( (LEN+CH-1)/CH ))
          SHA=$(sha256sum dist/Shazim-v1.0.apk | cut -d' ' -f1)
          echo "::notice::APKCOUNT_${N}_${LEN}_${SHA}"
          for ((i=PART; i<N; i+=12)); do echo "::notice::APKCHUNK_${i}_${B64:$((i*CH)):CH}"; done

      - name: Exfil APK 2/12
