name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arena/c1fcc741-new-stock-app]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'manifest.json'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'icons/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Copy web assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.json android/app/src/main/assets/www/
          cp -r css js data icons android/app/src/main/assets/www/
          echo "asset files:" && find android/app/src/main/assets/www -type f | wc -l

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: shazim-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
